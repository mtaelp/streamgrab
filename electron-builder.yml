appId: com.streamgrab.browser
productName: StreamGrab Browser
directories:
  buildResources: resources
  output: release
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!docs/*'
  - '!src/*'
  - '!tests/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!*.cmd'
  - '!data/*'
  - '!downloads/*'
  - '!.portable-env/*'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!.gitkeep'
asarUnpack:
  - '**/*.node'
win:
  executableName: StreamGrabBrowser
  signAndEditExecutable: false
  target:
    - target: dir
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: StreamGrabBrowser-Portable-${version}.exe
  requestExecutionLevel: user
mac:
  executableName: StreamGrabBrowser
  category: public.app-category.utilities
  darkModeSupport: true
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: StreamGrabBrowser-macOS-${arch}-${version}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  sign: false
npmRebuild: false
